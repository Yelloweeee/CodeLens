[project]
name = "codebase-qa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ananya Kulkarni", email = "ananyadoescoding@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "gitpython>=3.2.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
codebase-qa = "codebase_qa:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
